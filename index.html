<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>artRandom</title>
<style>
:root {
  --bg: #f3eee4; --surface: #fffdf8; --ink: #1e1b17; --muted: #7a7266; --line: #e2dacb;
  --chip: #e9e1d2; --accent: #c8402a; --accent-ink: #fff;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15130f; --surface: #1f1c17; --ink: #ede7db; --muted: #9a9184; --line: #353028;
    --chip: #2b2720; --accent: #ff6b4f; --accent-ink: #1a0f0c;
  }
}
:root[data-theme="dark"] {
  --bg: #15130f; --surface: #1f1c17; --ink: #ede7db; --muted: #9a9184; --line: #353028;
  --chip: #2b2720; --accent: #ff6b4f; --accent-ink: #1a0f0c;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
button { font: inherit; color: inherit; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 32px 16px 64px; }

header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; }
h1 { margin: 0; font: 600 clamp(32px, 6vw, 52px)/1 "Iowan Old Style", "Palatino Linotype", Georgia, serif; letter-spacing: -0.015em; }
.notice { margin: 8px 0 0; color: var(--accent); font-size: 13px; }
.loading { color: var(--muted); }
.sub { margin: 8px 0 0; color: var(--muted); }
.actions { display: flex; gap: 8px; }
.roll {
  border: 0; border-radius: 999px; padding: 14px 28px; cursor: pointer;
  background: var(--accent); color: var(--accent-ink); font-size: 17px; font-weight: 600;
}
.roll:active { transform: translateY(1px); }
.ghost {
  border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 14px 18px; cursor: pointer;
  color: var(--ink); text-decoration: none; display: inline-flex; align-items: center;
}
.ghost:hover { border-color: var(--muted); }

.controls { margin-top: 24px; display: grid; gap: 10px; }
.bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.bar .lbl { width: 84px; flex: none; color: var(--muted); font-size: 13px; }
.chip {
  border: 1px solid var(--line); background: transparent; color: var(--muted);
  border-radius: 999px; padding: 5px 12px; font-size: 13px; cursor: pointer;
}
.chip:hover { color: var(--ink); border-color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.chip.preset { background: var(--chip); border-color: transparent; color: var(--ink); }
.chip.preset[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

.grid { columns: 300px; column-gap: 16px; margin-top: 28px; }
.card {
  break-inside: avoid; margin: 0 0 16px; padding: 14px 16px 16px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
}
.card.locked { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.head h2 { margin: 0; flex: 1; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
.head .src { color: var(--muted); font-weight: 400; letter-spacing: 0; text-transform: none; }
.icon {
  width: 30px; height: 30px; display: grid; place-items: center; flex: none;
  border: 1px solid var(--line); border-radius: 50%; background: transparent; color: var(--muted); cursor: pointer;
}
.icon:hover { color: var(--ink); border-color: var(--muted); }
.icon[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
.icon svg { width: 15px; height: 15px; }

.slot + .slot { margin-top: 12px; }
.slot .k { color: var(--muted); font-size: 12px; }
.slot .v {
  display: block; width: 100%; padding: 0; border: 0; background: none; text-align: left; cursor: pointer;
  font: 21px/1.25 "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  text-decoration: underline dotted transparent; text-underline-offset: 4px;
}
.slot .v:hover { text-decoration-color: var(--accent); }
.slot .v.error { color: var(--accent); font-family: inherit; font-size: 14px; }
.slot .n { color: var(--muted); font-size: 13px; margin-top: 3px; }
.compact .slot { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.compact .slot + .slot { margin-top: 0; border-top: 1px solid var(--line); }
.compact .slot .k { flex: none; max-width: 50%; padding: 7px 0; font-size: 13px; }
.compact .slot .v { width: auto; padding: 5px 0; text-align: right; font-size: 17px; }
.hint { margin-top: 14px; padding-top: 10px; border-top: 1px dashed var(--line); color: var(--muted); font-size: 13px; }
.hint p { margin: 0 0 6px; }
.hint a { color: inherit; }

.empty { color: var(--muted); margin-top: 40px; text-align: center; }
.fatal { margin-top: 40px; padding: 20px; border: 1px solid var(--accent); border-radius: 14px; background: var(--surface); }
footer { margin-top: 32px; color: var(--muted); font-size: 13px; }
footer a { color: inherit; }
kbd { border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; font: 12px ui-monospace, monospace; }

@media (max-width: 560px) {
  .actions { width: 100%; }
  .roll { flex: 1; }
  .bar .lbl { width: 100%; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="title">Задачник</h1>
      <p class="sub">Клик по любому значению перебрасывает только его.</p>
      <p class="notice" id="notice" hidden></p>
    </div>
    <div class="actions">
      <button class="ghost" id="copy">Копировать</button>
      <button class="roll" id="roll">Бросить</button>
    </div>
  </header>

  <div class="controls" id="controls">
    <div class="bar" id="presets"><span class="lbl">Наборы</span></div>
    <div class="bar" id="toggles"><span class="lbl">Карточки</span></div>
  </div>

  <main class="grid" id="grid"><p class="loading">Загружаю таблицу…</p></main>
  <p class="empty" id="empty" hidden>Включите хотя бы одну карточку.</p>

  <footer>
    <kbd>Пробел</kbd> — бросить всё, кроме закреплённых. Замок на карточке не даёт её перебросить.
  </footer>
</div>

<script src="engine.js"></script>
<script src="config.js"></script>
<script src="sheet.js"></script>
<script>
// Карточки и наборы — из config.js, таблицы — из Google-таблицы при каждом открытии
let CFG = window.ARTRANDOM_CONFIG;
let ready = false;

const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
};

if (!window.ArtEngine || !CFG) {
  document.getElementById('controls').hidden = true;
  const box = el('div', 'fatal');
  box.append(
    el('strong', null, !window.ArtEngine ? 'Не загрузился engine.js.' : 'Не загрузился config.js.'),
    el('p', null, 'Файлы engine.js, config.js и sheet.js должны лежать в той же папке, что и index.html. '
      + 'Если config.js правили руками, проверьте, что в нём нет синтаксической ошибки.'),
  );
  document.getElementById('grid').replaceWith(box);
  throw new Error('artRandom: нет движка или конфига');
}

const CARDS = CFG.cards || [];
const BY_ID = Object.fromEntries(CARDS.map(c => [c.id, c]));
const ALL = '__all__';
const PRESETS = [
  ...(CFG.presets || []).map(p => ({ name: p.name, cards: p.cards.filter(id => BY_ID[id]) })),
  { name: 'Всё', cards: CARDS.map(c => c.id) },
];

const store = {
  get(k) { try { return JSON.parse(localStorage.getItem('artRandom:' + k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem('artRandom:' + k, JSON.stringify(v)); } catch {} },
};

const savedOn = (store.get('on') || []).filter(id => BY_ID[id]);
const state = {
  on: new Set(savedOn.length ? savedOn : PRESETS[0].cards),
  locked: new Set((store.get('locked') || []).filter(id => BY_ID[id])),
  vals: {},
};
const save = () => { store.set('on', [...state.on]); store.set('locked', [...state.locked]); };

function rollCard(id) {
  const slots = ArtEngine.buildCard(CFG, BY_ID[id]);
  state.vals[id] = { slots, out: slots.map(ArtEngine.rollSlot) };
}

function rollSlot(id, i) {
  const v = state.vals[id];
  v.out[i] = ArtEngine.rollSlot(v.slots[i]);
}

// Текст подсказки: строки → абзацы, ссылки кликабельны
function hintNode(text) {
  const box = el('div', 'hint');
  for (const line of String(text).split('\n').filter(l => l.trim())) {
    const p = el('p');
    line.split(/(https?:\/\/\S+)/).forEach((part, i) => {
      if (i % 2) {
        const a = el('a', null, part.replace(/^https?:\/\//, '').replace(/\/$/, ''));
        a.href = part; a.target = '_blank'; a.rel = 'noopener';
        p.append(a);
      } else if (part) p.append(part);
    });
    box.append(p);
  }
  return box;
}

const ICON_REROLL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>';
const ICON_LOCK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
const ICON_UNLOCK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.75-1.4"/></svg>';

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

function flicker(node, slot, final) {
  if (reduceMotion) { node.textContent = final; return; }
  let i = 0;
  const timer = setInterval(() => {
    if (++i > 7) { clearInterval(timer); node.textContent = final; return; }
    node.textContent = ArtEngine.rollSlot(slot).t;
  }, 40);
}

// fresh: набор ключей "id:i", которые надо анимировать
function render(fresh = new Set()) {
  const grid = document.getElementById('grid');
  grid.replaceChildren();
  const active = CARDS.filter(c => state.on.has(c.id));
  document.getElementById('empty').hidden = active.length > 0;

  for (const card of active) {
    if (!state.vals[card.id]) rollCard(card.id);
    const { slots, out } = state.vals[card.id];
    const locked = state.locked.has(card.id);

    const box = el('section', 'card' + (locked ? ' locked' : '') + (card.compact ? ' compact' : ''));
    const head = el('div', 'head');
    const h = el('h2', null, card.title + ' ');
    if (card.src) h.append(el('span', 'src', card.src));
    const lock = el('button', 'icon');
    lock.innerHTML = locked ? ICON_LOCK : ICON_UNLOCK;
    lock.setAttribute('aria-pressed', locked);
    lock.title = locked ? 'Открепить' : 'Закрепить';
    lock.onclick = () => { locked ? state.locked.delete(card.id) : state.locked.add(card.id); save(); render(); };
    const again = el('button', 'icon');
    again.innerHTML = ICON_REROLL;
    again.title = 'Перебросить карточку';
    again.onclick = () => {
      rollCard(card.id);
      render(new Set(state.vals[card.id].slots.map((_, i) => `${card.id}:${i}`)));
    };
    head.append(h, lock, again);
    box.append(head);

    slots.forEach((slot, i) => {
      const row = el('div', 'slot');
      if (slot.label) row.append(el('div', 'k', slot.label));
      const v = el('button', 'v' + (out[i].error ? ' error' : ''), out[i].t);
      v.title = 'Перебросить только это';
      v.onclick = () => { rollSlot(card.id, i); render(new Set([`${card.id}:${i}`])); };
      row.append(v);
      out[i].n.forEach(line => row.append(el('div', 'n', line)));
      box.append(row);
      if (fresh.has(`${card.id}:${i}`) && !out[i].error) flicker(v, slot, out[i].t);
    });

    if (card.hint) box.append(hintNode(card.hint));
    grid.append(box);
  }
  renderControls();
}

function rollAll() {
  if (!ready) return;
  const fresh = new Set();
  for (const id of state.on) {
    if (state.locked.has(id)) continue;
    rollCard(id);
    state.vals[id].slots.forEach((_, i) => fresh.add(`${id}:${i}`));
  }
  render(fresh);
}

function renderControls() {
  const presets = document.getElementById('presets');
  const toggles = document.getElementById('toggles');
  presets.querySelectorAll('.chip').forEach(n => n.remove());
  toggles.querySelectorAll('.chip').forEach(n => n.remove());

  for (const { name, cards } of PRESETS) {
    const b = el('button', 'chip preset', name);
    const match = cards.length === state.on.size && cards.every(id => state.on.has(id));
    b.setAttribute('aria-pressed', match);
    b.onclick = () => {
      state.on = new Set(cards);
      save();
      const fresh = new Set();
      cards.forEach(id => {
        if (state.locked.has(id) && state.vals[id]) return;
        rollCard(id);
        state.vals[id].slots.forEach((_, i) => fresh.add(`${id}:${i}`));
      });
      render(fresh);
    };
    presets.append(b);
  }
  for (const card of CARDS) {
    const b = el('button', 'chip', card.title);
    b.setAttribute('aria-pressed', state.on.has(card.id));
    b.onclick = () => {
      state.on.has(card.id) ? state.on.delete(card.id) : state.on.add(card.id);
      save();
      render();
    };
    toggles.append(b);
  }
}

function asText() {
  return CARDS.filter(c => state.on.has(c.id)).map(card => {
    const { slots, out } = state.vals[card.id];
    const lines = slots.map((s, i) => {
      const extra = out[i].n.length ? ` (${out[i].n.join('; ')})` : '';
      return `  ${s.label ? s.label + ': ' : ''}${out[i].t}${extra}`;
    });
    return `${card.title}\n${lines.join('\n')}`;
  }).join('\n\n');
}

document.getElementById('roll').onclick = rollAll;
document.getElementById('copy').onclick = async e => {
  const btn = e.currentTarget, text = asText();
  try { await navigator.clipboard.writeText(text); }
  catch {
    const ta = el('textarea'); ta.value = text; document.body.append(ta); ta.select();
    document.execCommand('copy'); ta.remove();
  }
  btn.textContent = 'Скопировано';
  setTimeout(() => { btn.textContent = 'Копировать'; }, 1200);
};
document.addEventListener('keydown', e => {
  if (e.code !== 'Space' || e.target.closest('button, input, textarea, a')) return;
  e.preventDefault();
  rollAll();
});

function showNotice(text) {
  const n = document.getElementById('notice');
  n.textContent = text;
  n.hidden = false;
}

(window.ArtSheet ? ArtSheet.load(CFG) : Promise.reject(new Error('не загрузился sheet.js')))
  .then(({ cfg, title, notices }) => {
    CFG = cfg;
    if (title) { document.getElementById('title').textContent = title; document.title = title; }
    if (notices.length) showNotice(`В таблице ${notices.join('; ')} — для этих данных показана сохранённая копия.`);
  })
  .catch(e => showNotice(location.protocol === 'file:'
    ? 'Страница открыта как файл с диска — Google не отдаёт таблицу таким страницам. Показана сохранённая копия; свежие данные будут, если открыть задачник по ссылке.'
    : `Не удалось загрузить таблицу (${e.message}). Показана сохранённая копия.`))
  .finally(() => { ready = true; rollAll(); });
</script>
</body>
</html>
